
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks | To-Do App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f6fc;
      color: #202033;
      min-height: 100vh;
      padding: 55px 15px;
    }

    .app {
      max-width: 626px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: auto auto 18px;
      display: grid;
      place-items: center;
      background: #7057f5;
      color: white;
      border-radius: 18px;
      font-size: 36px;
      box-shadow: 0 8px 20px #7057f533;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    header p {
      color: #9695a7;
      font-size: 14px;
    }

    .container {
      background: white;
      border: 1px solid #ecebf2;
      border-radius: 23px;
      padding: 23px;
      box-shadow: 0 15px 40px #22204408;
    }

    form {
      display: flex;
      gap: 10px;
    }

    #taskInput {
      flex: 1;
      min-width: 0;
      padding: 17px 14px;
      border: 1px solid #e5e4ed;
      border-radius: 14px;
      outline: none;
      font-size: 14px;
    }

    #taskInput:focus {
      border-color: #7057f5;
    }

    .add-btn {
      border: none;
      border-radius: 14px;
      padding: 0 22px;
      background: #9a85f8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #7057f5;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: #9695a7;
      font-size: 12px;
      margin: 25px 0 18px;
    }

    .filters {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #eeeef4;
      padding-bottom: 16px;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: #77778a;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #eeeaff;
      color: #7057f5;
      font-weight: bold;
    }

    #taskList {
      list-style: none;
      margin-top: 16px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 13px;
      border: 1px solid #eae9f0;
      border-radius: 15px;
      margin-bottom: 9px;
      font-size: 13px;
      color: #555568;
    }

    .task input {
      width: 17px;
      height: 17px;
      accent-color: #7057f5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #aaa9b8;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: #aaa9b8;
      font-size: 23px;
      cursor: pointer;
    }

    .delete-btn:hover {
      color: #e05269;
    }

    .empty {
      text-align: center;
      color: #9695a7;
      padding: 30px 10px;
      font-size: 14px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #eeeef4;
      margin-top: 15px;
      padding-top: 20px;
      color: #9695a7;
      font-size: 12px;
    }

    #clearCompleted {
      background: transparent;
      color: #8e80df;
      border: none;
      cursor: pointer;
    }

    .tagline {
      text-align: center;
      color: #9695a7;
      font-size: 12px;
      margin-top: 30px;
    }

    @media (max-width: 480px) {
      body {
        padding: 35px 12px;
      }

      .container {
        padding: 16px;
      }

      h1 {
        font-size: 32px;
      }

      .add-btn {
        padding: 0 14px;
      }

      .filters {
        gap: 3px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <div class="logo">✓</div>
      <h1>My Tasks</h1>
      <p>Plan your day. Make progress.</p>
    </header>

    <section class="container">

      <form id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="What do you need to do?"
          maxlength="180"
          required
        >
        <button type="submit" class="add-btn">+ Add</button>
      </form>

      <div class="stats">
        <span id="remaining">0 remaining</span>
        <span id="completedCount">0 completed</span>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="taskList"></ul>

      <div class="empty" id="emptyMessage" hidden>
        No tasks here. Add a task above!
      </div>

      <div class="footer">
        <span id="total">0 total tasks</span>
        <button id="clearCompleted">Clear completed</button>
      </div>

    </section>

    <p class="tagline">
      Small steps every day lead to big results.
    </p>

  </main>

  <script>
    const input = document.getElementById("taskInput");
    const form = document.getElementById("taskForm");
    const list = document.getElementById("taskList");

    let tasks = [];

    try {
      const saved = JSON.parse(
        localStorage.getItem("myTasks") || "[]"
      );

      if (Array.isArray(saved)) {
        tasks = saved.filter(
          task => task &&
          typeof task.id === "string" &&
          typeof task.text === "string"
        );
      }
    } catch (error) {
      tasks = [];
    }

    let currentFilter = "all";

    function saveTasks() {
      localStorage.setItem("myTasks", JSON.stringify(tasks));
    }

    function addTask(text) {
      tasks.unshift({
        id: Date.now().toString() + Math.random(),
        text: text,
        completed: false
      });

      saveTasks();
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return {
            ...task,
            completed: !task.completed
          };
        }
        return task;
      });

      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    function renderTasks() {
      list.replaceChildren();

      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") {
          return !task.completed;
        }

        if (currentFilter === "completed") {
          return task.completed;
        }

        return true;
      });

      visibleTasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task";

        if (task.completed) {
          li.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Toggle task");
        checkbox.addEventListener("change", () => {
          toggleTask(task.id);
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", "Delete task");
        deleteButton.addEventListener("click", () => {
          deleteTask(task.id);
        });

        li.append(checkbox, text, deleteButton);
        list.appendChild(li);
      });

      const completed = tasks.filter(
        task => task.completed
      ).length;

      const remaining = tasks.length - completed;

      document.getElementById("remaining").textContent =
        remaining + " remaining";

      document.getElementById("completedCount").textContent =
        completed + " completed";

      document.getElementById("total").textContent =
        tasks.length + (tasks.length === 1
          ? " total task"
          : " total tasks");

      document.getElementById("emptyMessage").hidden =
        visibleTasks.length !== 0;

      list.hidden = visibleTasks.length === 0;

      document.querySelectorAll(".filter-btn").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.filter === currentFilter
        );
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (!text) return;

      addTask(text);
      input.value = "";
      input.focus();
    });

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", function() {
        currentFilter = this.dataset.filter;
        renderTasks();
      });
    });

    document.getElementById("clearCompleted")
      .addEventListener("click", function() {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        renderTasks();
      });

    renderTasks();
  </script>
</body>
</html>
